<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Bayesian Optimization</title>
  <desc id="desc">Pink Awesome-style glasses containing a Gaussian-process surrogate and an acquisition-function optimum.</desc>

  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8fc"/>
      <stop offset="1" stop-color="#fcecf5"/>
    </linearGradient>
    <clipPath id="left-lens">
      <rect x="40" y="178" width="194" height="150" rx="46"/>
    </clipPath>
    <clipPath id="right-lens">
      <rect x="278" y="178" width="194" height="150" rx="46"/>
    </clipPath>
  </defs>

  <g transform="translate(218)">
  <!-- The peaked temples echo the original Awesome mark. -->
  <path d="M52 172 171 62l22 24-93 86h312l-93-86 22-24 119 110"
        fill="none" stroke="#fc60a8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lenses -->
  <rect x="40" y="168" width="204" height="170" rx="54" fill="url(#lens)" stroke="#fc60a8" stroke-width="18"/>
  <rect x="268" y="168" width="204" height="170" rx="54" fill="url(#lens)" stroke="#fc60a8" stroke-width="18"/>
  <path d="M242 205h28" fill="none" stroke="#fc60a8" stroke-width="18" stroke-linecap="round"/>

  <!-- Gaussian-process surrogate: uncertainty band, posterior mean, and observations. -->
  <g clip-path="url(#left-lens)">
    <path d="M45 266c23-14 42-36 61-33 24 4 25 45 49 43 24-2 37-57 84-75v63c-38 14-52 52-83 55-31 2-37-35-57-37-17-2-31 12-54 26Z"
          fill="#fc60a8" opacity=".18"/>
    <path d="M45 287c25-14 40-33 60-29 22 4 28 43 52 40 29-3 39-57 82-73"
          fill="none" stroke="#494368" stroke-width="8" stroke-linecap="round"/>
    <g fill="#fc60a8" stroke="#fff" stroke-width="4">
      <circle cx="76" cy="271" r="8"/>
      <circle cx="119" cy="272" r="8"/>
      <circle cx="163" cy="293" r="8"/>
      <circle cx="211" cy="241" r="8"/>
    </g>
  </g>

  <!-- Acquisition function and selected next evaluation. -->
  <g clip-path="url(#right-lens)">
    <path d="M272 307c26-2 38-10 52-28 12-16 22-31 34-19 10 10 14 35 30 34 21-2 25-61 80-74v94H272Z"
          fill="#fc60a8" opacity=".2"/>
    <path d="M272 307c26-2 38-10 52-28 12-16 22-31 34-19 10 10 14 35 30 34 21-2 25-61 80-74"
          fill="none" stroke="#494368" stroke-width="8" stroke-linecap="round"/>
    <path d="M433 185v59" fill="none" stroke="#fc60a8" stroke-width="7" stroke-linecap="round" stroke-dasharray="5 13"/>
    <path d="m433 252-13-18h26Z" fill="#fc60a8"/>
  </g>

  </g>

