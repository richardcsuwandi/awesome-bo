name: Refresh preprints

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Propose title-matching preprints
        run: python3 scripts/update_papers.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Propose new method preprints"
          title: "Weekly preprint suggestions"
          body: |
            Automated **suggestions** for Recent Preprints (title must contain
            Bayesian optimization / BayesOpt). This PR does **not** auto-merge.

            Review before merging:
            - Drop application papers even if the title matches
            - Keep method / benchmark papers
            - After acceptance, move an entry into the matching Papers section
          branch: automation/readme-refresh
          delete-branch: true
